name: nexus-local

services:
  db:
    image: postgres:16-alpine
    container_name: nexus_local_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_local}
    ports:
      - '5433:5432'
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexus_local}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data:

