name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/capmoo-capstone/nexus-procure-backend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment and systemd files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.prod.yaml,ops/systemd'
          target: '/opt/nexus-procure'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_PRODUCTION
          script: |
            cd /opt/nexus-procure

            # Create or update .env.production from GitHub Secret
            printf '%s\n' "$ENV_PRODUCTION" > .env.production

            # Log in to ghcr.io
            echo ${{ secrets.GHCR_TOKEN }} | \
              docker login ghcr.io -u ${{ secrets.VPS_USER }} --password-stdin

            sudo install -m 0755 ops/systemd/nexus-procure-cron.sh /opt/nexus-procure/ops/systemd/nexus-procure-cron.sh
            sudo install -m 0644 ops/systemd/nexus-procure-cron@.service /etc/systemd/system/nexus-procure-cron@.service
            sudo install -m 0644 ops/systemd/nexus-procure-process-deadlines.timer /etc/systemd/system/
            sudo install -m 0644 ops/systemd/nexus-procure-contract-committee-reminders.timer /etc/systemd/system/
            sudo install -m 0644 ops/systemd/nexus-procure-daily-summary-email.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now nexus-procure-process-deadlines.timer nexus-procure-contract-committee-reminders.timer nexus-procure-daily-summary-email.timer
            sudo systemctl is-active nexus-procure-process-deadlines.timer nexus-procure-contract-committee-reminders.timer nexus-procure-daily-summary-email.timer

            # Pull the latest image
            docker compose -f docker-compose.prod.yaml --env-file .env.production pull

            # Restart with new image
            docker compose -f docker-compose.prod.yaml --env-file .env.production up -d

            # Run pending migrations
            docker compose -f docker-compose.prod.yaml exec -T app npx prisma migrate deploy

            # Clean up old images
            docker image prune -f
